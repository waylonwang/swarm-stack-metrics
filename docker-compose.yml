---
# Update Time: 2024-05-31 01:10
version: "3.4"

x-defines:
  service-common: &service-common-ref
    networks: [network_cluster]
    restart: on-failure
  env-common: &env-common-ref
    NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1}
    TZ: ${TZ:-Asia/Shanghai}    
  env-proxy: &env-proxy-ref
    HTTP_PROXY: ${OPENCLASH_HTTP_PROXY}
    HTTPS_PROXY: ${OPENCLASH_HTTP_PROXY}
    http_proxy: ${OPENCLASH_HTTP_PROXY}
    https_proxy: ${OPENCLASH_HTTP_PROXY}
  deploy-common: &deploy-common-ref
    mode: replicated
    replicas: 1
    restart_policy:
      condition: on-failure
      delay: 5s      
  placement-default: &placement-default-ref
    placement:
      constraints:
        - node.labels.type == vm
        - node.labels.metrics == true
  placement-nas: &placement-nas-ref
    placement:
      constraints:
        - node.labels.type == nas
        - node.labels.nas == primary
  resource-low-128m: &resource-low-128m-ref
    resources:
      limits:
        memory: 128M
      reservations:
        memory: 32M
  resource-low-256m: &resource-low-256m-ref
    resources:
      limits:
        memory: 256M
      reservations:
        memory: 64M        
  resource-medium-512m: &resource-medium-512m-ref
    resources:
      limits:
        memory: 512M
      reservations:
        memory: 64M
  resource-high-4g: &resource-high-4g-ref
    resources:
      limits:
        memory: 4G
      reservations:
        memory: 2G          
  driver-common: &driver-common-ref
    type: nfs
    o: addr=${NFS_SERVER},rw,nfsvers=4

services:
  # ------------------------------------------------------------
  # Grafana监控数据看板
  # ------------------------------------------------------------
  grafana:
    <<: *service-common-ref
    # image-ref: grafana/grafana:11.0.0
    image: registry.${DOMAIN_SWARM}:${EXTERNAL_PORT}/grafana/grafana:11.0.0
    environment:
      <<: *env-common-ref
      # 直接使用Portainer容器内的环境变量
      PUID: 1000
      PGID: 1000
    volumes:
      - nfs_grafana_data:/var/lib/grafana
      - nfs_grafana_conf:/usr/share/grafana/conf
    logging:
      driver: fluentd
      options:
        tag: docker.metrics.grafana
        fluentd-async-connect: "true"
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN_SWARM}`,`grafana.${DOMAIN_EMERGENCY}`)
        - traefik.http.routers.grafana.entrypoints=websecure
        - traefik.http.routers.grafana.service=grafana
        - traefik.http.routers.grafana.middlewares=auth,normal-chain@file
        - traefik.http.services.grafana.loadbalancer.server.port=3000
        - homepage.group=Metrics & Monitor
        - homepage.name=Grafana
        - homepage.icon=grafana.png
        - homepage.href=https://grafana.${DOMAIN_SWARM}:${EXTERNAL_PORT}/
        - homepage.description=Grafana监控数据看板
        - homepage.siteMonitor=http://grafana:3000
        - homepage.weight=10
        - homepage.widget.type=grafana
        - homepage.widget.url=http://grafana:3000
        - homepage.widget.username=${HOMEPAGE_GRAFANA_USERNAME}
        - homepage.widget.password=${HOMEPAGE_GRAFANA_PASSWORD}
      <<: [*deploy-common-ref, *placement-default-ref, *resource-low-128m-ref]

  # ------------------------------------------------------------
  # Prometheus监控度量系统
  # ------------------------------------------------------------
  prometheus:
    <<: *service-common-ref
    # image-ref: prom/prometheus:v2.52.0
    image: registry.${DOMAIN_SWARM}:${EXTERNAL_PORT}/prom/prometheus:v2.52.0
    command: --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/data --web.console.libraries=/usr/share/prometheus/console_libraries --web.enable-lifecycle --web.console.templates=/usr/share/prometheus/consoles
    environment:
      <<: *env-common-ref
      # 直接使用Portainer容器内的环境变量
      PUID: 0
      PGID: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - nfs_prometheus_conf:/etc/prometheus
      - nfs_prometheus_data:/data
    logging:
      driver: fluentd
      options:
        tag: docker.metrics.prometheus
        fluentd-async-connect: "true"
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN_SWARM}`,`prometheus.${DOMAIN_EMERGENCY}`)
        - traefik.http.routers.prometheus.entrypoints=websecure
        - traefik.http.routers.prometheus.service=prometheus
        - traefik.http.routers.prometheus.middlewares=auth,normal-chain@file
        - traefik.http.services.prometheus.loadbalancer.server.port=9090
        - homepage.group=Metrics & Monitor
        - homepage.name=Prometheus
        - homepage.icon=prometheus.png
        - homepage.href=https://prometheus.${DOMAIN_SWARM}:${EXTERNAL_PORT}/
        - homepage.description=Prometheus监控度量系统
        - homepage.siteMonitor=http://prometheus:9090
        - homepage.weight=11
      <<: [*deploy-common-ref, *placement-default-ref, *resource-medium-512m-ref]

  # ------------------------------------------------------------
  # AlertManager报警服务
  # ------------------------------------------------------------
  alertmanager:
    <<: *service-common-ref
    # image-ref: prom/alertmanager:v0.27.0
    image: registry.${DOMAIN_SWARM}:${EXTERNAL_PORT}/prom/alertmanager:v0.27.0
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    environment:
      <<: *env-common-ref
    volumes:
      - nfs_alertmanager:/etc/alertmanager
    logging:
      driver: fluentd
      options:
        tag: docker.metrics.alertmanager
        fluentd-async-connect: "true"
    deploy:
      <<: [*deploy-common-ref, *placement-default-ref, *resource-low-128m-ref]
      labels:
        - traefik.enable=true
        - traefik.http.routers.alertmanager.rule=Host(`alertmanager.${DOMAIN_SWARM}`,`alertmanager.${DOMAIN_EMERGENCY}`)
        - traefik.http.routers.alertmanager.entrypoints=websecure
        - traefik.http.routers.alertmanager.service=alertmanager
        - traefik.http.routers.alertmanager.middlewares=auth,normal-chain@file
        - traefik.http.services.alertmanager.loadbalancer.server.port=9093
        - homepage.group=Metrics & Monitor
        - homepage.name=AlertManager
        - homepage.icon=alertmanager.png
        - homepage.href=https://alertmanager.${DOMAIN_SWARM}:${EXTERNAL_PORT}/
        - homepage.description=Prometheus警报管理器
        - homepage.siteMonitor=http://alertmanager:9093
        - homepage.weight=12

  # ------------------------------------------------------------
  # SNMP Exporter度量提取器
  # ------------------------------------------------------------
  snmp-exporter:
    <<: *service-common-ref
    # image-ref: prom/snmp-exporter:v0.22.0
    image: registry.${DOMAIN_SWARM}:${EXTERNAL_PORT}/prom/snmp-exporter:v0.22.0
    command:
      - "--config.file=/etc/snmp_exporter/snmp.yml"
    ports:
      - 9116:9116
    environment:
      <<: *env-common-ref
    volumes:
      - nfs_snmp-exporter:/etc/snmp_exporter
    logging:
      driver: fluentd
      options:
        tag: docker.metrics.snmp-exporter
        fluentd-async-connect: "true"
    deploy:
      <<: [*deploy-common-ref, *placement-default-ref, *resource-low-128m-ref]

  # ------------------------------------------------------------
  # PVE Exporter度量提取器
  # ------------------------------------------------------------
  # pve-exporter:
  #   # 3.0之后改了结构，只能固定到2.3.1
  #   image: prompve/prometheus-pve-exporter:2.3.1
  #   networks: [network_cluster]
  #   restart: on-failure
  #   ports:
  #     - 9221:9221
  #   environment:
  #     PVE_USER: ${PVE_USER}
  #     PVE_TOKEN_NAME: ${PVE_TOKEN_NAME}
  #     PVE_TOKEN_VALUE: ${PVE_TOKEN_VALUE}
  #     PVE_VERIFY_SSL: ${PVE_VERIFY_SSL}
  #     TZ: ${TZ}
  #   volumes:
  #     - nfs_pve-exporter_src:/usr/lib/python3.11/site-packages/pve_exporter
  #   deploy:
  #     placement:
  #       constraints:
  #         - node.labels.type == vm
  #         - node.labels.metrics == true
  #     resources:
  #       limits:
  #         memory: 128M
  #       reservations:
  #         memory: 64M
  pve-exporter:
    <<: *service-common-ref
    # image-ref: prompve/prometheus-pve-exporter:3.4.2
    image: registry.${DOMAIN_SWARM}:${EXTERNAL_PORT}/prompve/prometheus-pve-exporter:3.4.2
    ports:
      - 9222:9221
    environment:
      <<: *env-common-ref
      PVE_USER: ${PVE_USER}
      PVE_TOKEN_NAME: ${PVE_TOKEN_NAME}
      PVE_TOKEN_VALUE: ${PVE_TOKEN_VALUE}
      PVE_VERIFY_SSL: ${PVE_VERIFY_SSL}
    # volumes:
      # - nfs_pve-exporter_src:/usr/lib/python3.11/site-packages/pve_exporter
    logging:
      driver: fluentd
      options:
        tag: docker.metrics.pve-exporter
        fluentd-async-connect: "true"
    deploy:
      <<: [*deploy-common-ref, *placement-default-ref, *resource-low-128m-ref]

  # ------------------------------------------------------------
  # EFK Stack: ElasticSearch全文检索数据库
  # ------------------------------------------------------------
  elasticsearch:
    <<: *service-common-ref
    # image-ref: library/elasticsearch:7.17.21
    image: registry.${DOMAIN_SWARM}:${EXTERNAL_PORT}/library/elasticsearch:7.17.21
    environment:
      <<: *env-common-ref
      # - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      ES_JAVA_OPTS: -Xms2g -Xmx2g
      discovery.type: single-node
      node.master: "true"
      node.data: "true"
      node.ingest: "true"
      LOGSPOUT: ignore"
      # - "cluster.name=es-cluster"
      # - "discovery.zen.minimum_master_nodes=1"
      # - "discovery.zen.ping.unicast.hosts=elasticsearch"
      # - "node.name=es-node-1"
      # - "node.name=es-node.{{.Task.Slot}}.{{.Node.Hostname}}"
      # - "bootstrap.system_call_filter=false"
      # cluster.name: "elasticsearch" #设置集群名称为elasticsearch
      # discovery.type: "single-node" #以单一节点模式启动
      # ES_JAVA_OPTS: "-Xms512m -Xmx512m" #设置使用jvm内存大小
      # ES_JAVA_OPTS: "-Xms2g -Xmx2g"
    volumes:
      - nfs_elk_elasticsearch_data:/usr/share/elasticsearch/data
      - nfs_elk_elasticsearch_plugins:/usr/share/elasticsearch/plugins
      - nfs_elk_elasticsearch_conf:/usr/share/elasticsearch/config
    ports:
      # - "9200:9200"
      # - "9300:9300"
      - target: 9200
        published: 9200
        protocol: tcp
        mode: host
    deploy:
      <<: [*deploy-common-ref, *placement-nas-ref, *resource-high-4g-ref]
      # resources:
      #   limits:
      #     cpus: '2'
      #     memory: 2G

  # ------------------------------------------------------------
  # EFK Stack: Fluentd日志采集器
  # ------------------------------------------------------------
  fluentd:
    <<: *service-common-ref
    # image-ref: ruanbekker/fluentd-elasticsearch:latest
    image: registry.${DOMAIN_SWARM}:${EXTERNAL_PORT}/ruanbekker/fluentd-elasticsearch:latest
    environment:
      <<: *env-common-ref
      FLUENTD_CONF: 'fluent.conf'
      FLUENTD_HOSTNAME: '{{.Node.Hostname}}'
      # FLUENTD_HOSTNAME: 'HomeNAS'
    ports:
      - 24224:24224
      - 24224:24224/udp
    user: root
    configs:
      - source: metrics.fluentd.conf_HomeNAS-elasticsearch
        target: /fluentd/etc/fluent.conf
    deploy:
      <<: [*deploy-common-ref, *placement-nas-ref, *resource-low-128m-ref]

  # ------------------------------------------------------------
  # EFK Stack: Kibana日志数据看板
  # ------------------------------------------------------------
  kibana:
    <<: *service-common-ref
    # image-ref: library/kibana:7.17.21
    image: registry.${DOMAIN_SWARM}:${EXTERNAL_PORT}/library/kibana:7.17.21
    environment:
      <<: *env-common-ref
      SERVER_NAME: kibana.${DOMAIN:-localhost}
      # - ELASTICSEARCH_URL=http://192.168.11.99:9200
      # - ELASTICSEARCH_HOSTS=http://192.168.11.99:9200
      # - ELASTICSEARCH_URL=${ELASTICSEARCH_HOST:-http://elasticsearch}:${ELASTICSEARCH_PORT:-9200}
      # - ELASTICSEARCH_HOSTS=${ELASTICSEARCH_HOST:-http://elasticsearch}:${ELASTICSEARCH_PORT:-9200}
      # elasticsearch.hosts: "http://elasticsearch:9200" #设置访问elasticsearch的地址
      # ELASTICSEARCH_URL: "http://elasticsearch:9200"
    ports:
        # - "12201:12201/udp"
        # - 5601:5601
      - target: 5601
        published: 5601
        protocol: tcp
        mode: host
    volumes:
      - nfs_elk_kibana_conf:/usr/share/kibana/config
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.kibana.rule=Host(`efk.${DOMAIN_SWARM}`,`efk.${DOMAIN_EMERGENCY}`)
        - traefik.http.routers.kibana.entrypoints=websecure
        - traefik.http.routers.kibana.service=kibana
        - traefik.http.routers.kibana.middlewares=auth,normal-chain@file
        - traefik.http.services.kibana.loadbalancer.server.port=5601
        # - traefik.http.services.kibana.loadbalancer.server.responseTimeout=180s # 调整为你需要的时间
        # - traefik.http.services.kibana.loadbalancer.server.idleTimeout=5m     # 调整为你需要的时间
        - homepage.group=Metrics & Monitor
        - homepage.name=EFK Stack - Kibana
        - homepage.icon=kibana.png
        - homepage.href=https://efk.${DOMAIN_SWARM}:${EXTERNAL_PORT}/
        - homepage.description=EFK堆栈 - Kibana日志数据看板
        - homepage.siteMonitor=http://kibana:5601
        - homepage.weight=20
      <<: [*deploy-common-ref, *placement-nas-ref, *resource-low-256m-ref]
      # resources:
      #   limits:
      #     cpus: '2'
      #     memory: 1G


