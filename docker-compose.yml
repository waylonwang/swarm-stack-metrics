version: "3.4"

services:
  # Grafana
  grafana:
    image: grafana/grafana:latest
    networks: [network_cluster]
    restart: on-failure
    environment:
      # 直接使用Portainer容器内的环境变量
      PUID: 1000
      PGID: 1000       
      TZ: ${TZ}
    volumes:
      - nfs_grafana_data:/var/lib/grafana
      - nfs_grafana_conf:/usr/share/grafana/conf
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN_SWARM}`,`grafana.${DOMAIN_EMERGENCY}`)
        - traefik.http.routers.grafana.entrypoints=websecure
        - traefik.http.routers.grafana.service=grafana
        - traefik.http.routers.grafana.middlewares=auth,normal-chain@file
        - traefik.http.services.grafana.loadbalancer.server.port=3000
        - homepage.group=Metrics & Monitor
        - homepage.name=Grafana
        - homepage.icon=grafana.png
        - homepage.href=https://grafana.${DOMAIN_SWARM}:${EXTERNAL_PORT}/
        - homepage.description=Grafana
        - homepage.siteMonitor=http://grafana:3000
        - homepage.weight=10
        - homepage.widget.type=grafana
        - homepage.widget.url=http://grafana:3000
        - homepage.widget.username=${HOMEPAGE_GRAFANA_USERNAME}
        - homepage.widget.password=${HOMEPAGE_GRAFANA_PASSWORD}        
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.type == vm
          - node.labels.metrics == true
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
          
  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    command: --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/data --web.console.libraries=/usr/share/prometheus/console_libraries --web.enable-lifecycle --web.console.templates=/usr/share/prometheus/consoles
    networks: [network_cluster]
    restart: on-failure
    environment:
      # 直接使用Portainer容器内的环境变量
      PUID: 0
      PGID: 0 
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - nfs_prometheus_conf:/etc/prometheus
      - nfs_prometheus_data:/data
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN_SWARM}`,`prometheus.${DOMAIN_EMERGENCY}`)
        - traefik.http.routers.prometheus.entrypoints=websecure
        - traefik.http.routers.prometheus.service=prometheus
        - traefik.http.routers.prometheus.middlewares=auth,normal-chain@file
        - traefik.http.services.prometheus.loadbalancer.server.port=9090
        - homepage.group=Metrics & Monitor
        - homepage.name=Prometheus
        - homepage.icon=prometheus.png
        - homepage.href=https://prometheus.${DOMAIN_SWARM}:${EXTERNAL_PORT}/
        - homepage.description=Prometheus
        - homepage.siteMonitor=http://prometheus:9090
        - homepage.weight=11
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.type == vm
          - node.labels.metrics == true
      # resources:
      #   limits:
      #     memory: 512M
      #   reservations:
      #     memory: 64M

  # AlertManager
  alertmanager:
    image: prom/alertmanager:latest
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    networks: [network_cluster]
    restart: on-failure
    environment:   
      TZ: ${TZ}
    volumes:
      - nfs_alertmanager:/etc/alertmanager
    deploy:
      placement:
        constraints:
          - node.labels.type == vm
          - node.labels.metrics == true
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
      labels:
        - traefik.enable=true
        - traefik.http.routers.alertmanager.rule=Host(`alertmanager.${DOMAIN_SWARM}`,`alertmanager.${DOMAIN_EMERGENCY}`)
        - traefik.http.routers.alertmanager.entrypoints=websecure
        - traefik.http.routers.alertmanager.service=alertmanager
        - traefik.http.routers.alertmanager.middlewares=auth,normal-chain@file
        - traefik.http.services.alertmanager.loadbalancer.server.port=9093
        - homepage.group=Metrics & Monitor
        - homepage.name=AlertManager
        - homepage.icon=alertmanager.png
        - homepage.href=https://alertmanager.${DOMAIN_SWARM}:${EXTERNAL_PORT}/
        - homepage.description=Prometheus Alert Manager
        - homepage.siteMonitor=http://alertmanager:9093
        - homepage.weight=12

  # SNMP Exporter
  snmp-exporter:
    image: prom/snmp-exporter:v0.22.0
    command:
      - "--config.file=/etc/snmp_exporter/snmp.yml"
    networks: [network_cluster]
    restart: on-failure
    ports:
      - 9116:9116
    environment:
      TZ: ${TZ}
    volumes:
      - nfs_snmp-exporter:/etc/snmp_exporter
    deploy:
      placement:
        constraints:
          - node.labels.type == vm
          - node.labels.metrics == true
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # PVE Exporter
  pve-exporter:
    # 3.0之后改了结构，只能固定到2.3.1 
    image: prompve/prometheus-pve-exporter:2.3.1
    networks: [network_cluster]
    restart: on-failure
    ports:
      - 9221:9221
    environment:
      PVE_USER: ${PVE_USER}
      PVE_TOKEN_NAME: ${PVE_TOKEN_NAME} 
      PVE_TOKEN_VALUE: ${PVE_TOKEN_VALUE} 
      PVE_VERIFY_SSL: ${PVE_VERIFY_SSL} 
      TZ: ${TZ}
    volumes:
      - nfs_pve-exporter_src:/usr/lib/python3.11/site-packages/pve_exporter
    deploy:
      placement:
        constraints:
          - node.labels.type == vm
          - node.labels.metrics == true
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # PVE Exporter
  pve-exporter3:
    image: prompve/prometheus-pve-exporter:latest
    networks: [network_cluster]
    restart: on-failure
    ports:
      - 9222:9221
    environment:
      PVE_USER: ${PVE_USER}
      PVE_TOKEN_NAME: ${PVE_TOKEN_NAME} 
      PVE_TOKEN_VALUE: ${PVE_TOKEN_VALUE} 
      PVE_VERIFY_SSL: ${PVE_VERIFY_SSL} 
      TZ: ${TZ}
    # volumes:
      # - nfs_pve-exporter_src:/usr/lib/python3.11/site-packages/pve_exporter
    deploy:
      placement:
        constraints:
          - node.labels.type == vm
          - node.labels.metrics == true
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # ELK
  elk:
    image: sebp/elk:8.13.4
    networks: [network_cluster]
    restart: on-failure    
    ports:
      - "5601:5601"
      - "9200:9200"
      - "5001:5001"
      # - "5044:5044"  
    environment:
      TZ: ${TZ}  
    volumes:
      - nfs_elk_kibana_conf:/opt/kibana/config             
      - nfs_elk_elasticsearch_conf:/opt/elasticsearch/config   
      - nfs_elk_logstash_conf:/opt/logstash/config    
      - nfs_elk_logstash_pipelines:/etc/logstash/conf.d   
      - nfs_elk_elasticsearch_plugins:/opt/elasticsearch/plugins
      - nfs_elk_elasticsearch_data:/var/lib/elasticsearch
    deploy:
      labels:    
        - traefik.enable=true
        - traefik.http.routers.elk.rule=Host(`elk.${DOMAIN_SWARM}`,`elk.${DOMAIN_EMERGENCY}`)
        - traefik.http.routers.elk.entrypoints=websecure
        - traefik.http.routers.elk.service=elk
        - traefik.http.routers.elk.middlewares=auth,normal-chain@file
        - traefik.http.services.elk.loadbalancer.server.port=5601
        - homepage.group=Metrics & Monitor
        - homepage.name=ELK
        - homepage.icon=kibana.png
        - homepage.href=https://elk.${DOMAIN_SWARM}:${EXTERNAL_PORT}/
        - homepage.description=ELK
        - homepage.siteMonitor=http://elk:5601
        - homepage.weight=20             
      replicas: 1     
      placement:
        constraints:
          - node.labels.type == vm
          - node.labels.metrics == true    

  logspout-vm:
    image: gliderlabs/logspout:v3.2.14
    command: syslog+tcp://elk:5000
    networks: [network_cluster]
    # environment:
    #   SYSLOG_STRUCTURED_DATA: "<Loggly Customer Token>@41058"
    #   tag: "<custom tag>"
    volumes:
      - /etc/hostname:/etc/host_hostname:ro
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      mode: global
      # resources:
      #   limits:
      #     cpus: '0.20'
      #     memory: 256M
      #   reservations:
      #     cpus: '0.10'
      #     memory: 128M      
      placement:
        constraints:
          - node.platform.os == linux    
          - node.labels.type == vm      

  logspout-router:
    image: gliderlabs/logspout:v3.2.14
    command: syslog+tcp://192.168.11.117:5000
    networks: [network_cluster]
    # environment:
    #   SYSLOG_STRUCTURED_DATA: "<Loggly Customer Token>@41058"
    #   tag: "<custom tag>"
    volumes:
      - /etc/hostname:/etc/host_hostname:ro
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      mode: replicated
      replicas: 1
      # resources:
      #   limits:
      #     cpus: '0.20'
      #     memory: 256M
      #   reservations:
      #     cpus: '0.10'
      #     memory: 128M      
      placement:
        constraints:
          - node.role == manager
          - node.labels.type == router

