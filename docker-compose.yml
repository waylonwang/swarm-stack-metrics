    image: ruanbekker/fluentd-elasticsearch
    networks: [network_cluster]    
    user: root
    environment:
      FLUENTD_CONF: 'fluent.conf'
      FLUENTD_HOSTNAME: '{{.Node.Hostname}}'
    ports:
      - 24224:24224
      - 24224:24224/udp
    # volumes:
    #   - nfs_fluentd_conf:/fluentd/etc/fluent.conf
    configs:
      - source: fluentd_conf.v1
